name: Build the code on all platforms (Linux, MacOS, Windows)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ldflags: ""
          - os: macos-latest
            ldflags: ""
          - os: windows-latest
            ldflags: -lws2_32
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: g++ -std=c++17 main.cpp -o main ${{ matrix.ldflags }}

      - name: Run
        run: ./main
